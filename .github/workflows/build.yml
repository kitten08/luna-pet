name: Build Luna Pet

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: pack:mac
            label: mac-intel
            args: -- --x64
          - os: macos-latest
            command: pack:mac
            label: mac-arm64
            args: -- --arm64
          - os: windows-latest
            command: pack:win
            label: windows-x64
            args: ''
          - os: ubuntu-latest
            command: pack:linux
            label: linux-x64
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.command }} ${{ matrix.args }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v7
        with:
          name: luna-${{ matrix.label }}
          path: |
            release/*.zip
            release/*.exe
            release/*.AppImage
          if-no-files-found: error

  web-and-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test
      - run: npm run build
      - name: Package web, extension, and DSH plugin
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          mkdir -p release/web
          cp -R dist/. release/web/
          cp offline/serve.mjs offline/start-offline.command offline/start-offline.bat offline/README.txt release/web/
          cp LICENSE THIRD_PARTY_NOTICES.md release/web/
          chmod +x release/web/start-offline.command
          (
            cd release/web
            zip -qry "../Luna-Pet-Website-v${version}.zip" .
          )
          (
            cd builds/browser-extension
            zip -qry "../../release/Luna-Pet-Browser-Extension-v${version}.zip" .
          )
          (
            cd builds/dsh-plugin
            npm pack --pack-destination ../../release
          )
      - uses: actions/upload-artifact@v7
        with:
          name: luna-web-and-plugins
          path: |
            release/*.zip
            release/*.tgz
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs:
      - desktop
      - web-and-plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: luna-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          title="Luna Pet ${tag}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
            gh release edit "$tag" --title "$title" --notes-file docs/RELEASE-v1.3.1.md --latest
          else
            gh release create "$tag" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file docs/RELEASE-v1.3.1.md \
              --latest
          fi
